<VirtualHost *:80>
    ServerName ai.dqtech.cloud

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyTimeout 900

    ProxyPass        / http://127.0.0.1:3001/ connectiontimeout=5 timeout=900
    ProxyPassReverse / http://127.0.0.1:3001/

    ErrorLog ${APACHE_LOG_DIR}/ai.dqtech.cloud-error.log
    CustomLog ${APACHE_LOG_DIR}/ai.dqtech.cloud-access.log combined
</VirtualHost>
